<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幻想镇社区管理</title><link rel="stylesheet" href="/admin/style.css"></head><body>
<section id="login" class="login"><form id="login-form"><h1>幻想镇社区管理</h1><label>管理员账号<input name="username" value="admin" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p>首次密码位于服务端 data/初始管理员密码.txt</p></form></section>
<div id="workspace" hidden><aside><h2>幻想镇<span>社区服务管理</span></h2><button data-tab="overview">运行状态</button><button data-tab="notices">通知公告</button><button data-tab="messages">聊天记录</button><button data-tab="users">用户管理</button><button data-tab="settings">服务配置</button><button id="logout">退出登录</button></aside><main>
<header><h1 id="heading">运行状态</h1><button id="refresh" class="secondary">刷新</button></header>
<section data-view="overview"><div class="stats"><article><span>在线用户</span><strong id="online-count">0</strong></article><article><span>语音中</span><strong id="voice-count">0</strong></article><article><span>服务版本</span><strong id="version">—</strong></article></div><h2>在线连接</h2><div id="online-list"></div></section>
<section data-view="notices" hidden><form id="notice-form" class="panel"><h2>发布公告</h2><label>分组<select name="groupId"><option value="survival">原版生存群组</option><option value="mod-1">模组一服</option><option value="mod-2">模组二服</option></select></label><label>标题<input name="title" maxlength="100" required></label><label>正文<textarea name="body" rows="5" maxlength="12000" required></textarea></label><button>发布</button></form><div id="notice-list"></div></section>
<section data-view="messages" hidden><div id="message-list"></div></section>
<section data-view="users" hidden><form id="ban-form" class="panel inline"><label>角色 UUID<input name="uid" required></label><button>封禁用户</button></form><h2>已封禁</h2><div id="ban-list"></div></section>
<section data-view="settings" hidden><form id="settings-form" class="panel"><h2>权限与语音</h2><label>客户端公告管理员角色 UUID（每行一个）<textarea name="adminIDs" rows="4"></textarea></label><label>TURN 地址<input name="turnUrl" placeholder="turn:voice.example.com:3478"></label><label>TURN 密钥（留空保留已有值）<input name="turnSecret" type="password" autocomplete="new-password"></label><p id="turn-status"></p><h2>HXZ UP 更新日志来源</h2><p>每个服填写自己的客户端根地址，使用不同整合包路径；留空表示不接入。保存后最多 30 秒刷新。</p><label>原版生存群组<input name="hxz_survival" placeholder="https://update.example.com/packs/survival"></label><label>模组一服<input name="hxz_mod1" placeholder="https://update.example.com/packs/mod1"></label><label>模组二服<input name="hxz_mod2" placeholder="https://update.example.com/packs/mod2"></label><button>保存配置</button></form><form id="password-form" class="panel"><h2>修改后台密码</h2><label>新密码<input name="password" minlength="12" type="password" autocomplete="new-password" required></label><button>修改密码</button></form></section>
</main></div><div id="message" role="status" hidden></div><script src="/admin/app.js"></script></body></html>
