[binaries]
c = ['E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe', '--target=aarch64-none-linux-android26', '--sysroot=E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot']
cpp = ['E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/clang++.exe', '--target=aarch64-none-linux-android26', '--sysroot=E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot']
ar = 'E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe'
strip = 'E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-strip.exe'
nm = 'E:/hxz_up/hxzup/tools/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-nm.exe'
[properties]
needs_exe_wrapper = true
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'
[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
c_link_args = ['-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']
cpp_link_args = ['-static-libstdc++', '-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']
