apply plugin: 'com.android.application'
android {
    namespace 'top.hxzmc.community'
    compileSdk 35
    ndkVersion '30.0.16248370'
    if (System.getenv('HXZ_ANDROID_NDK')) ndkPath System.getenv('HXZ_ANDROID_NDK')
    defaultConfig {
        applicationId 'top.hxzmc.community'
        minSdk 29
        targetSdk 35
        versionCode 80500
        versionName '0.8.5'
        externalNativeBuild { cmake { abiFilters 'arm64-v8a'; arguments '-DANDROID_STL=c++_shared' } }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main {
        assets.srcDir '../../web/dist'
        assets.srcDir layout.buildDirectory.dir('fcl-notices')
        assets.srcDir layout.buildDirectory.dir('game-probe-assets')
        java.srcDir '../../third_party/concentus'
        java.srcDir '../../runtime/src/main/java'
    }
    externalNativeBuild { cmake { path file('../../runtime/native/CMakeLists.txt'); version '3.22.1' } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    signingConfigs {
        release {
            if (System.getenv('HXZ_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('HXZ_ANDROID_KEYSTORE'))
                storePassword System.getenv('HXZ_ANDROID_STORE_PASSWORD')
                keyAlias 'hxz-community'
                keyPassword System.getenv('HXZ_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
tasks.register('copyFclNotices', Copy) {
    from '../../third_party/fcl-renderer'
    into layout.buildDirectory.dir('fcl-notices/licenses/fcl-renderer')
}
tasks.named('preBuild').configure { dependsOn 'copyFclNotices' }
tasks.register('compileGameProbe', JavaCompile) {
    source fileTree('../../game-probe/src') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('game-probe-classes')
    options.encoding = 'UTF-8'
    options.release = 8
}
tasks.register('packageGameProbe', Jar) {
    dependsOn 'compileGameProbe'
    from layout.buildDirectory.dir('game-probe-classes')
    archiveFileName = 'hxz-game-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('game-probe-assets')
    manifest { attributes 'Premain-Class': 'top.hxzmc.diagnostics.GameProbe' }
}
tasks.named('preBuild').configure { dependsOn 'packageGameProbe' }
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
