<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幻想镇 · 全页面设计概览</title><link rel="stylesheet" href="overview.css"></head><body>
<header class="mast"><div class="brand"><span>幻</span><div><b>幻想镇</b><small>0.5.2-air / 全页面设计概览</small></div></div><nav id="filters"></nav><a class="launcher-link" href="http://127.0.0.1:5186" target="_blank">启动页交互预览 ↗</a></header>
<main id="board"><section class="intro"><div><p>FANTASY TOWN · INTERFACE ATLAS</p><h1>一个启动器，完整的游玩路径。</h1><div class="intro-note">从开始游戏到社区交流，统一的卡片、清晰的操作层级。点击任意页面可放大查看。</div></div><aside><strong id="count">55</strong><span>页面与状态</span><strong>06</strong><span>功能分区</span></aside></section><div class="design-note">本轮为设计提案，页面数据均为样例。原活动仅展示嵌入容器；产品业务、游戏及管理操作尚未在本轮重做。</div><div id="groups"></div><footer class="endnote"><span>幻想镇 0.5.2-air · 2026 / 09 / 29</span><span>设计确认后实施　/　未替换正式程序　/　未上传 GitHub</span></footer></main>
<div class="viewer" id="viewer" hidden><header><div><span id="view-code"></span><strong id="view-title"></strong><small id="view-note"></small></div><div class="viewer-tools"><button id="prev">← 上一页</button><button id="next">下一页 →</button><a id="original" target="_blank">原图 ↗</a><button id="close" aria-label="关闭大图">×</button></div></header><div class="viewer-image"><img id="view-image" alt="页面设计"></div><footer>方向键切换页面　·　Esc 关闭　·　点击“原图”可进一步放大</footer></div>
<script src="catalog.js"></script><script>
const board=document.querySelector('#groups');let activeGroup='全部',viewIndex=0;
const sections=GROUPS.map((group,i)=>{const section=document.createElement('section');section.className='group';section.dataset.group=group;section.innerHTML='<div class="group-heading"><span>'+String(i+1).padStart(2,'0')+'</span><h2>'+group+'</h2><p>'+HXZ_PAGES.filter(p=>p.group===group).length+' 个页面与状态</p></div><div class="screen-grid"></div>';HXZ_PAGES.filter(p=>p.group===group).forEach(page=>{const button=document.createElement('button');button.className='screen-card';button.innerHTML='<div class="thumbnail"><img loading="lazy" src="shots/'+page.id+'.png" alt="'+page.title+'"></div><div class="screen-label"><span>'+page.id.split('-')[0]+'</span><strong>'+page.title+'</strong><i>↗</i></div>';button.addEventListener('click',()=>openPage(HXZ_PAGES.indexOf(page)));section.querySelector('.screen-grid').append(button)});board.append(section);return section});
function filter(group){activeGroup=group;sections.forEach(s=>s.hidden=group!=='全部'&&s.dataset.group!==group);document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('selected',b.textContent===group))}
['全部',...GROUPS].forEach(group=>{const b=document.createElement('button');b.textContent=group;b.className=group==='全部'?'selected':'';b.onclick=()=>filter(group);document.querySelector('#filters').append(b)});document.querySelector('#count').textContent=HXZ_PAGES.length;
function openPage(index){viewIndex=(index+HXZ_PAGES.length)%HXZ_PAGES.length;const page=HXZ_PAGES[viewIndex];document.querySelector('#view-code').textContent=page.id.split('-')[0];document.querySelector('#view-title').textContent=page.title;document.querySelector('#view-note').textContent=page.note||page.group;document.querySelector('#view-image').src='shots/'+page.id+'.png';document.querySelector('#original').href='shots/'+page.id+'.png';document.querySelector('#viewer').hidden=false;document.body.style.overflow='hidden';location.hash=page.id}
function closeView(){document.querySelector('#viewer').hidden=true;document.body.style.overflow='';history.replaceState(null,'',location.pathname)}document.querySelector('#close').onclick=closeView;document.querySelector('#prev').onclick=()=>openPage(viewIndex-1);document.querySelector('#next').onclick=()=>openPage(viewIndex+1);document.addEventListener('keydown',e=>{if(document.querySelector('#viewer').hidden)return;if(e.key==='Escape')closeView();if(e.key==='ArrowLeft')openPage(viewIndex-1);if(e.key==='ArrowRight')openPage(viewIndex+1)});if(location.hash){const index=HXZ_PAGES.findIndex(p=>p.id===location.hash.slice(1));if(index>=0)openPage(index)}
</script></body></html>
