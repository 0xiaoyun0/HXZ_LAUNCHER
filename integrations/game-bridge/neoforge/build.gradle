plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'top.hxzmc'
version = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
tasks.named('processResources').configure { inputs.property 'productVersion', project.version; filesMatching('META-INF/neoforge.mods.toml'){ expand(productVersion:project.version) } }
base { archivesName = 'hxz-community-bridge-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs { server { server(); programArgument '--nogui' } }
    mods { hxz_community_bridge { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { manifest { attributes('Implementation-Version': project.version) } }
