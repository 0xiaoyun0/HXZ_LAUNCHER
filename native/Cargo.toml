[package]
name = "hxz-launcher"
version = "1.0.0-beta.1"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
webview2-com = "0.39"
windows-core = "0.62"
tauri-plugin-single-instance = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
open = "5"
image = { version = "0.25", default-features = false, features = ["png","jpeg","webp","gif"] }
trash = "5"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

